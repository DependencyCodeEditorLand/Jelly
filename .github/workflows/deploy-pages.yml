# Deploy the Jelly UI docs site to GitHub Pages.
#
# The library is authored in TypeScript and bundled with Vite, so the site is
# BUILT before it publishes: `npm run build:site` builds dist/jelly.js (the
# single bundle the docs load via package.js), regenerates the API data from the
# component sources, and assembles a clean _site/ (the two pages, dist, package.js,
# the docs assets and the Lottie player) - so only the site is uploaded, not the
# whole repository. Every push to main publishes; the workflow can also be run by
# hand from the Actions tab. Enable Pages once in the repo settings:
# Settings → Pages → Source → "GitHub Actions".

name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

# Allow exactly what Pages deployment needs
permissions:
    contents: read
    pages: write
    id-token: write

# One deploy at a time; let an in-flight production deploy finish
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    # Quality gate: the library must typecheck, its tests must pass and it must
    # build before the site is allowed to publish.
    verify:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repository
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Type-check
              run: npm run typecheck

            - name: Install the test browser
              run: npx playwright install --with-deps chromium

            - name: Run the real-browser tests
              run: npm test

            - name: Build the library
              run: npm run build

            - name: Syntax-check the docs runtime + build scripts
              run: |
                  find docs -name '*.js' -print0 | xargs -0 -n1 node --check
                  node --check package.js
                  node --check server.mjs
                  node --check scripts/build-site.mjs
                  node --check scripts/build-docs-data.mjs

    deploy:
        needs: verify
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Check out the repository
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Assemble the site into _site/
              run: npm run build:site

            - name: Configure GitHub Pages
              uses: actions/configure-pages@v5

            - name: Upload the assembled site
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
